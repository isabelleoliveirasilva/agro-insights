[project]
name = "agro-insights"
version = "0.1.0"
description = "Pipeline de dados inspirado no setor agroquímico: ETL, SQL, API Flask e relatórios."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
